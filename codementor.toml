[limits]
max_lines = 600
max_bytes = 40960

[validation]
tier1_enabled = true         # derleyici kuruluysa kullanılır; yoksa SKIPPED (ADR-0009)
compile_timeout_s = 10
compile_memory_mb = 1024     # POSIX RLIMIT_AS / Windows Job Object bellek sınırı
stub_header = "data/stubs/ue_stubs.h"
roslyn_check_dll = "tools/roslyn-check/out/RoslynCheck.dll"   # make roslyn-check

[pipeline]
mode = "two_pass"            # two_pass | single_pass
max_repair_attempts = 1
use_cache = true

[data]
questions_dir = "data/questions"
checklists_dir = "data/checklists"
call_costs_file = "data/call_costs.yaml"

[rules]
disabled = []               # ör. ["CPP-OWN-001"]; kural kataloğu: docs/rules-catalog.md

[providers]
default = "ollama"
fallback = ["deepseek"]
max_retries = 2              # yalnızca ağ/429/5xx hatalarında (4xx hemen hata)

[providers.ollama]
base_url = "http://127.0.0.1:11434"
model = "qwen2.5-coder:7b"
num_ctx = 16384              # prompt bütçesi de buradan (§5.4.5); 600 satırlık kod için 32768 önerilir
temperature = 0.1
seed = 42
timeout_s = 120

[providers.openai]
model = ""                   # güncel model adını buraya yaz
api_key_env = "OPENAI_API_KEY"

[providers.deepseek]
base_url = "https://api.deepseek.com"
timeout_s = 60
model = ""
api_key_env = "DEEPSEEK_API_KEY"

[providers.claude_cli]         # Claude Code CLI; `claude` ile oturum açılmış olmalı (ADR-0012)
command = "claude"
model = "claude-opus-5-5"
context_tokens = 200000        # prompt bütçesi (mimari §5.4.5)
timeout_s = 300

[providers.agy]                # Antigravity CLI; deneysel, araç kapatma bayrağı yok (ADR-0012)
command = "agy"
model = ""
timeout_s = 300
allow_tool_agent = false       # true: öğrenci kodunu araç çalıştırabilen ajana vermeyi kabul et

[providers.anthropic]
model = ""                   # ör. güncel Claude model kimliği
api_key_env = "ANTHROPIC_API_KEY"
context_tokens = 200000
# temperature/seed verme: güncel Claude modelleri temperature'ı reddediyor (ADR-0011)
