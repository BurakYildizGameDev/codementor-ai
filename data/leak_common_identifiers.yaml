# Sızıntı koruması (mimari §5.6, verify/leak_guard.py): referans çözümde geçip öğrenci kodunda
# geçmeyen tanımlayıcılar "yasaklı" sayılır. Buradaki adlar yasaklanmaz: dil anahtar sözcükleri,
# standart kütüphane / BCL / motorun her yerde geçen genel adları ve kısa genel değişken adları.
# Bir ad buraya yalnızca çözümü ele vermiyorsa eklenmeli (ör. HashSet, Dictionary EKLENMEZ: bir
# soruda "HashSet" demek çözümü söylemektir).
version: 1

common:
  - "true"
  - "false"
  - "null"
  - return
  - if
  - else
  - for
  - while
  - do
  - switch
  - case
  - break
  - continue
  - default
  - const
  - static
  - void
