id: unreal-easy-timer-spawner
version: 1
language: cpp
engine: unreal
difficulty: easy
title: "Cephane kutusunu yenileyen nokta"
prompt: |
  Belirli aralıklarla (ör. 10 saniyede bir) üzerinde bir cephane kutusu çıkaran bir yenileme
  noktası aktörü yazın. Önceki kutu hâlâ duruyorsa yeni kutu çıkarılmamalı. Kutu sınıfı ve
  yenileme aralığı editörden ayarlanabilmeli. Seviye kapanırken ya da nokta yok edilirken
  bekleyen yenileme işi çalışmamalı. Kutu çıkarılamazsa (ör. engel varsa) oyun çökmemeli.
constraints:
  - "Yenileme her karede kontrol edilmemeli"
  - "Nokta yok edildikten sonra yenileme işi çalışmamalı"
  - "Kutu çıkarma başarısız olursa geçersiz bir işaretçi kullanılmamalı"
expected:
  time: { spawn: "1" }
  space: "1"
concept_tags: [timers, lifecycle, tobjectptr]
checklist_extra:
  - "Yenileme süresi Tick içinde elle mi sayılıyor?"
  - "Bekleyen iş, aktör oyundan çıkarken temizleniyor mu?"
  - "SpawnActor'ın döndürdüğü değer null olabilir mi; kontrol ediliyor mu?"
reference_solution_path: private/solutions/unreal-easy-timer-spawner.cpp
hint_ladder:
  1: "Yenileme noktası yok edildikten iki saniye sonra bekleyen işin çalışırsa hangi nesneye erişir?"
  2: "Her karede bir sayaç azaltmak yerine motora 'şu kadar saniye sonra beni çağır' demenin yolu var mı?"
  3: "Bu kavramlar 'zamanlayıcı yönetimi (FTimerHandle)' ve 'EndPlay'de kaynak temizleme' olarak bilinir."
