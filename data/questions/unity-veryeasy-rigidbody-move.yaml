id: unity-veryeasy-rigidbody-move
version: 1
language: csharp
engine: unity
difficulty: very_easy
title: "Fizikle hareket eden oyuncu"
prompt: |
  WASD tuşlarıyla yürüyen ve Space ile zıplayan bir oyuncu betiği yazın. Oyuncuda bir Rigidbody
  bileşeni var; duvarlara çarptığında içlerinden geçmemeli ve titrememeli. Zıplama yalnızca
  oyuncu yerdeyken çalışmalı ve oyuncunun Space'e her basışı karşılık bulmalı. Yürüme hızı
  Inspector'dan ayarlanabilmeli.
constraints:
  - "Hareket fizik motoruyla uyumlu olmalı; oyuncu duvarların içinden geçmemeli"
  - "Zıplama tuşuna basış hiçbir koşulda kaçırılmamalı"
  - "Hareket kare hızından bağımsız olmalı"
expected:
  time: { update: "1", physics_step: "1" }
  space: "1"
concept_tags: [physics, input, lifecycle]
checklist_extra:
  - "transform.position doğrudan mı değiştiriliyor (fizik çarpışmasını atlar)?"
  - "Tek seferlik tuş basışı fizik adımında mı okunuyor (basış kaçabilir)?"
  - "Yerde olma kontrolü nasıl yapılıyor?"
reference_solution_path: private/solutions/unity-veryeasy-rigidbody-move.cs
hint_ladder:
  1: "Transform'u doğrudan taşıdığında fizik motoru çarpışmayı ne zaman fark ediyor?"
  2: "Ekran 144 FPS'te, fizik saniyede 50 adımda çalışıyorsa tek seferlik bir tuş basışını fizik adımında okumak her basışı yakalar mı?"
  3: "Bu kavramlar 'fizik güncellemesiyle kare güncellemesinin ayrılması (FixedUpdate)' ve 'girdiyi karede okuyup fizik adımında uygulama' olarak bilinir."
method_leaks:
  - "fixedupdate"
  - "moveposition"
  - "addforce"
  - "_jumprequested"
