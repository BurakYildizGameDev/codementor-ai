id: cs-easy-fizzbuzz-alloc
version: 1
language: csharp
engine: none
difficulty: easy
title: "FizzBuzz raporu"
prompt: |
  1'den n'ye kadar sayılar için FizzBuzz kurallarını uygulayan ve sonucu tek bir
  metin olarak döndüren `string BuildReport(int n)` metodunu yazın: 3'e bölünenler
  için "Fizz", 5'e bölünenler için "Buzz", ikisine de bölünenler için "FizzBuzz",
  diğerleri için sayının kendisi yazılmalı; her değer ayrı bir satırda olmalı.
  Metot n = 1.000.000 için de birkaç yüz milisaniye içinde tamamlanmalı.
constraints:
  - "Sonuç tek bir string olarak döndürülmeli"
  - "n <= 0 için boş metin döndürülmeli"
  - "Toplam çalışma süresi n'e göre doğrusal olmalı"
expected:
  time: { build_report: "n" }
  space: "n"
sample_io:
  - input: "n = 5"
    output: '["1", "2", "Fizz", "4", "Buzz"]'
    explanation: "1-5 arası FizzBuzz."
concept_tags: [string-building, allocation, gc]
checklist_extra:
  - "Döngünün her turunda kaç yeni string nesnesi oluşuyor?"
  - "Toplam kopyalanan karakter sayısı n ile nasıl büyüyor?"
reference_solution_path: private/solutions/cs-easy-fizzbuzz-alloc.cs
hint_ladder:
  1: "Döngünün her turunda sonuç metnine ekleme yaptığınızda bellekte ne oluşuyor?"
  2: "C#'ta string'ler değiştirilemez (immutable) ise, her eklemede önceki içeriğe ne oluyor? Toplam kopyalama miktarı n ile nasıl büyür?"
  3: "Bu kavramlar 'değiştirilemez metin birleştirmenin karesel maliyeti' ve 'değiştirilebilir metin tamponu' olarak bilinir."
method_leaks:
  - "stringbuilder"
  - "string.join"
  - "string.concat"
