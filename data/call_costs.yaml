# Bilinen çağrı maliyetleri (mimari §5.3.2). Değerler Big-O metnidir; sondaki `*` amortize.
# Anahtarlar:
#   c      : serbest fonksiyon adı (`strlen`)
#   cpp    : nitelikli ad (`std::sort`) veya `tip::metot` (`std::vector::push_back`, `TArray::Add`)
#   csharp : `Tip.Metot` (`List.Contains`), statik (`Array.Sort`), LINQ `Enumerable.Metot`
#   python : yerleşik (`sorted`), `tip.metot` (`list.insert`), modül (`heapq.heappush`)
# Üye çağrılarında tip, dosyadaki bildirimden çözülür; çözülemezse maliyet bilinmez (tahmin yok).
# Argümanı bilinen indeks desenleri tablo değerini daraltır (Faz H3):
#   `List.RemoveAt(xs.Count - 1)` → 1 (aynı listenin sonu; kaydırma yok)
#   `List.Insert(xs.Count, …)`    → 1* (sona ekleme = Add)
#   `RemoveAt(0)`, `Insert(0, …)`, bilinmeyen indeks → tablo değeri `n` (kaydırma var)
c:
  strlen: "n"
  strcmp: "n"
  strncmp: "n"
  strcpy: "n"
  strncpy: "n"
  strcat: "n"
  strchr: "n"
  strstr: "n"
  memcpy: "n"
  memmove: "n"
  memset: "n"
  memcmp: "n"
  qsort: "n log n"
  bsearch: "log n"

