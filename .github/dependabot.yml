# Faz D (O17): bağımlılık güncellemeleri haftalık PR olarak gelir; CI (pip-audit, npm audit,
# testler) her birini doğrular. Güvenlik güncellemeleri ayrıca Dependabot alerts ile gelir.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # tree-sitter 0.26.0: Point refcount hatası → segfault (py-tree-sitter#472, düzeltme 0.26.1'i
      # bekliyor). pyproject'teki `<0.26` sınırı bilinçli; 0.26.1 çıkınca bu blok kaldırılır.
      - dependency-name: tree-sitter
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
