name: Release

# Faz D (O17): `v*` etiketi → testler → Windows exe → duman testi → GitHub Release
# (zip + exe + SHA256SUMS). Elle yapılan, tekrarlanamayan release'in yerini alır.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8  # runner konsolu cp1252; Türkçe çıktı çökertmesin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync --locked

      # Etiket sürümle aynı olmalı (tek kaynak: codementor.__version__)
      - name: Etiket = sürüm
        shell: bash
        run: |
          version=$(uv run python -c "import codementor; print(codementor.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Etiket ${GITHUB_REF_NAME}, paket sürümü ${version}: eşleşmiyor" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: uv run ruff check .
      - run: uv run mypy src/
      - run: uv run pytest -m "not live and not compiler"

      # Roslyn denetleyicisi pakete girsin (self-contained, kullanıcıda dotnet gerekmez)
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet publish tools/roslyn-check -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o tools/roslyn-check/sc
      - run: uv run python build_exe.py --both

      # Duman testi: derlenen iki paket de pencere açmadan kaynaklarını ve çekirdeği denetler
      - name: Duman testi (onedir + onefile)
        shell: pwsh
        run: |
          $i = 0
          foreach ($exe in @("dist/CodeMentor/CodeMentor.exe", "dist/CodeMentor.exe")) {
            $i++
            $out = Join-Path $env:RUNNER_TEMP "self-check-$i.json"
            $proc = Start-Process -FilePath $exe -ArgumentList @("--self-check", $out) -Wait -PassThru
            Get-Content $out -Encoding utf8
            if ($proc.ExitCode -ne 0) { throw "$exe duman testi başarısız (çıkış $($proc.ExitCode))" }
            $result = Get-Content $out -Encoding utf8 | ConvertFrom-Json
            $roslyn = $result.checks | Where-Object { $_.name -eq "Roslyn denetleyicisi" }
            if (-not $roslyn.ok) { throw "$exe paketinde Roslyn denetleyicisi yok" }
          }

      - name: SHA256SUMS
        shell: bash
        working-directory: dist
        run: sha256sum "CodeMentor-${VERSION}-win64.zip" CodeMentor.exe > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-files
          path: |
            dist/CodeMentor-*-win64.zip
            dist/CodeMentor.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # yalnız release oluşturan iş yazabilir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-files
          path: release
      # Release notu CHANGELOG.md'deki bu sürümün bölümüdür
      - name: Release notu
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md'de $version bölümü yok" >&2; exit 1; }
          (cd release && sha256sum -c SHA256SUMS)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "CodeMentor AI ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
