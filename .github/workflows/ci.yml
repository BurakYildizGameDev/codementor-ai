name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # Windows: .cmd kısayolu ve Job Object yolları
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Lint ve tip kontrolü platformdan bağımsız; bir kez yeter
      - if: runner.os == 'Linux'
        run: uv run ruff check .
      - if: runner.os == 'Linux'
        run: uv run ruff format --check .
      - if: runner.os == 'Linux'
        run: uv run mypy src/
      - run: uv run pytest -m "not live"
