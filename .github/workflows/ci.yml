name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # Windows: .cmd kısayolu ve Job Object yolları
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Lint ve tip kontrolü platformdan bağımsız; bir kez yeter
      - if: runner.os == 'Linux'
        run: uv run ruff check .
      - if: runner.os == 'Linux'
        run: uv run ruff format --check .
      - if: runner.os == 'Linux'
        run: uv run mypy src/
      - if: runner.os == 'Linux'
        run: uv run pytest -m "not live"
      # Windows runner'daki g++ (MinGW) ilk çağrıda 10 sn'yi aşıyor, clang++ MSVC hedefli;
      # derleyici testleri Linux'ta koşar (PROGRESS "Sonraya")
      - if: runner.os == 'Windows'
        run: uv run pytest -m "not live and not compiler"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Tipler şemadan üretilir; elle düzenleme ya da güncel olmayan tip CI'da yakalanır
      - run: npm run gen:types && git diff --exit-code -- src/types
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium && npm run e2e
