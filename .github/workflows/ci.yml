name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # Windows: .cmd kısayolu ve Job Object yolları
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # C# Tier 1 (Roslyn) derleyici testleri Linux'ta koşsun (Faz 27); atlanırsa test başarısız
      - if: runner.os == 'Linux'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - if: runner.os == 'Linux'
        run: dotnet build tools/roslyn-check -c Release -o tools/roslyn-check/out
      # Derleyicisiz kullanıcı yolu (Faz 29): zig, codementor.toml'daki adresten sha256 ile kurulur;
      # sürüm/adres değişmedikçe önbellekten gelir (~100 MB indirme her koşuda tekrarlanmaz)
      - if: runner.os == 'Linux'
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ~/.codementor/toolchain/zig
          key: zig-${{ runner.os }}-${{ hashFiles('codementor.toml') }}
      - if: runner.os == 'Linux' && steps.zig-cache.outputs.cache-hit != 'true'
        run: uv run codementor toolchain install zig
      # Lint ve tip kontrolü platformdan bağımsız; bir kez yeter
      - if: runner.os == 'Linux'
        run: uv run ruff check .
      - if: runner.os == 'Linux'
        run: uv run ruff format --check .
      - if: runner.os == 'Linux'
        run: uv run mypy src/
      # Bağımlılık açığı denetimi (Faz 50, mimari §12): kilitli çalışma zamanı bağımlılıkları
      - if: runner.os == 'Linux'
        run: uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt
      - if: runner.os == 'Linux'
        run: uvx pip-audit --strict --requirement requirements-audit.txt
      - if: runner.os == 'Linux'
        run: uv run pytest -m "not live"
        env:
          CODEMENTOR_REQUIRE_ROSLYN: "1"
          CODEMENTOR_REQUIRE_ZIG: "1"
      # Windows runner'daki g++ (MinGW) ilk çağrıda 10 sn'yi aşıyor, clang++ MSVC hedefli;
      # derleyici testleri Linux'ta koşar (PROGRESS "Sonraya")
      - if: runner.os == 'Windows'
        run: uv run pytest -m "not live and not compiler"

  # Windows masaüstü paketi (Faz 23): tek dosya exe + onedir zip artefakt olarak indirilir.
  # PR'larda derlenmez (birkaç dakika); main push'unda ve elle tetiklemede çalışır.
  exe:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8  # runner konsolu cp1252; Türkçe çıktı çökertmesin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Roslyn denetleyicisi pakete girsin: self-contained tek dosya, kullanıcıda dotnet
      # gerekmez (Faz 29; Faz 27'de dotnet'e bağlıydı)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet publish tools/roslyn-check -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o tools/roslyn-check/sc
      - run: uv run python build_exe.py --both
      - uses: actions/upload-artifact@v4
        with:
          name: CodeMentor-win64
          path: |
            dist/CodeMentor.exe
            dist/CodeMentor-*-win64.zip
          if-no-files-found: error
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Yayımlanan pakete giren bağımlılıklarda yüksek önemli açık (Faz 50)
      - run: npm audit --omit=dev --audit-level=high
      # Tipler şemadan üretilir; elle düzenleme ya da güncel olmayan tip CI'da yakalanır
      - run: npm run gen:types && git diff --exit-code -- src/types
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium && npm run e2e
