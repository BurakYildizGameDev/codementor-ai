id: csharp-none-string-concat
language: csharp
engine: none
title: "C#: isim listesinden rapor metni"
code: |
  using System.Collections.Generic;

  public static class Report {
      public static string Build(List<string> names) {
          string result = "";
          for (int i = 0; i < names.Count; i++) {
              result += names[i] + ", ";
          }
          return result.Substring(0, result.Length - 2);
      }
  }
static_hint: "O(n^2)"
static_findings:
  - rule_id: CS-ALLOC-001
    line: 7
    evidence: "result += names[i] + \", \";"
    description: "Döngüde string birleştirme her turda yeni bir string oluşturuyor mu?"
analysis:
  complexity:
    reasoning_steps:
      - "6. satırdaki döngü n kez döner."
      - "7. satırdaki her birleştirme o ana kadarki metnin tamamını yeni bir string'e kopyalar; toplam kopyalama 1 + 2 + ... + n ile orantılı."
      - "Döngü tek katmanlı görünse de birleştirmenin maliyeti yüzünden zaman O(n^2); statik ipucu da bunu gösteriyor."
    time_complexity: "O(n^2)"
    space_complexity: "O(n)"
    optimal_time_target: "O(n)"
    agreement: agrees
  additional_findings:
    - category: edge_case
      severity: high
      line_start: 9
      line_end: null
      evidence: "result.Length - 2"
      description: "Liste boşsa result boş kalır ve Substring negatif uzunlukla çağrılır; çalışma zamanında istisna oluşur."
socratic:
  key_flaw_concept: "Değişmez string ve tekrarlı kopyalama"
  guiding_questions:
    - "C#'ta bir string'e += ile ekleme yaptığınızda var olan string mi değişir, yoksa yeni bir string mi oluşur?"
    - "names boş bir liste olduğunda sondaki virgülü silen kod ne yapar?"
  next_step_hint: "1000 isimle döngünün toplamda kaç karakter kopyaladığını kabaca hesaplayın."
