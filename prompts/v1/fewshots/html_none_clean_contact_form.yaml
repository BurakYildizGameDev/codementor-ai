title: "HTML: iletişim formu (temiz kod)"
code: |
  <!DOCTYPE html>
  <html lang="tr">
  <head>
    <meta charset="utf-8">
    <title>İletişim</title>
  </head>
  <body>
    <main>
      <h1>Bize ulaşın</h1>
      <form action="/mesaj" method="post">
        <label for="eposta">E-posta</label>
        <input type="email" id="eposta" name="eposta" required>
        <label for="mesaj">Mesajınız</label>
        <textarea id="mesaj" name="mesaj" rows="4"></textarea>
        <button type="submit">Gönder</button>
      </form>
    </main>
  </body>
  </html>
