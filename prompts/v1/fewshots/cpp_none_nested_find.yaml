id: cpp-none-nested-find
language: cpp
engine: none
title: "C++: iki vektörün kesişimi"
code: |
  #include <vector>
  #include <algorithm>

  std::vector<int> common(const std::vector<int>& a, const std::vector<int>& b) {
      std::vector<int> out;
      for (int x : a) {
          if (std::find(b.begin(), b.end(), x) != b.end())
              out.push_back(x);
      }
      return out;
  }
static_hint: "O(n^2)"
static_findings: []
analysis:
  complexity:
    reasoning_steps:
      - "6. satırdaki döngü a'nın her elemanı için bir kez döner: n tur."
      - "7. satırdaki std::find her turda b'yi baştan sona tarar: m karşılaştırma."
      - "a n, b m elemanlıysa toplam n·m karşılaştırma: O(n*m); ikisi aynı boyuttaysa karesel."
      - "out en fazla n eleman tutar: ek bellek O(n)."
    time_complexity: "O(n*m)"
    space_complexity: "O(n)"
    optimal_time_target: "O(n + m)"
    agreement: agrees
  additional_findings:
    - category: performance
      severity: medium
      certainty: high
      line_start: 7
      line_end: null
      evidence: "std::find(b.begin(), b.end(), x)"
      description: "a'daki her eleman için b tamamen taranıyor; kesişim karesel sürede hesaplanıyor."
    - category: edge_case
      severity: low
      certainty: high
      line_start: 8
      line_end: null
      evidence: "out.push_back(x);"
      description: "a'da tekrar eden bir değer çıktıya birden çok kez ekleniyor; bu istenen davranış mı?"
socratic:
  key_flaw_concept: "İç içe doğrusal arama"
  guiding_questions:
    - "a'da n, b'de m eleman varsa bir değerin b'de olup olmadığını anlamak için toplamda kaç karşılaştırma yapılıyor?"
    - "a = {2, 2} ve b = {2} için fonksiyon ne döndürür; beklediğin bu mu?"
  next_step_hint: "b'de bir değerin olup olmadığını her seferinde baştan taramadan nasıl bilebileceğinizi düşünün."
