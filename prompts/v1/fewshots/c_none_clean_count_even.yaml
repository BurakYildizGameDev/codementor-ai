id: c-none-clean-count-even
language: c
engine: none
title: "C: çift sayıları sayma (temiz kod)"
code: |
  int count_even(const int *values, int n) {
      int count = 0;
      for (int i = 0; i < n; i++) {
          if (values[i] % 2 == 0) {
              count++;
          }
      }
      return count;
  }
static_hint: "O(n)"
