id: cpp-unreal-uproperty
language: cpp
engine: unreal
title: "Unreal: hedef seçen taret"
code: |
  UCLASS()
  class ATurret : public AActor {
      GENERATED_BODY()
  public:
      virtual void Tick(float DeltaTime) override;
  private:
      AActor* Target;
      TArray<AActor*> Enemies;
  };

  void ATurret::Tick(float DeltaTime) {
      Super::Tick(DeltaTime);
      for (AActor* Enemy : Enemies) {
          if (GetDistanceTo(Enemy) < 1000.f) {
              Target = Enemy;
          }
      }
  }
static_hint: "O(n)"
static_findings:
  - rule_id: UE-GC-001
    line: 7
    evidence: "AActor* Target;"
    description: "Çöp toplayıcı yalnızca UPROPERTY ile işaretli alanları görür; bu alan ne gösterir?"
  - rule_id: UE-GC-001
    line: 8
    evidence: "TArray<AActor*> Enemies;"
    description: "Çöp toplayıcı yalnızca UPROPERTY ile işaretli alanları görür; bu alan ne gösterir?"
  - rule_id: UE-PERF-001
    line: 13
    evidence: "for (AActor* Enemy : Enemies) {"
    description: "Tick her karede çalışır. Bu iş gerçekten her karede mi gerekli?"
