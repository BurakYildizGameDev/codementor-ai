title: "Python: kelime sıklığı (temiz kod, bir öneri)"
code: |
  def word_frequencies(text: str) -> dict[str, int]:
      counts: dict[str, int] = {}
      for word in text.lower().split():
          counts[word] = counts.get(word, 0) + 1
      return counts
