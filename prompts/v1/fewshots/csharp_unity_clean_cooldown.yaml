id: csharp-unity-clean-cooldown
language: csharp
engine: unity
title: "Unity: bekleme süresi sayacı (temiz kod)"
code: |
  using UnityEngine;

  public class Cooldown : MonoBehaviour {
      [SerializeField] private float duration = 2f;
      private float remaining;

      public bool IsReady => remaining <= 0f;

      public void Trigger() {
          remaining = duration;
      }

      void Update() {
          if (remaining > 0f) {
              remaining -= Time.deltaTime;
          }
      }
  }
