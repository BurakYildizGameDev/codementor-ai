title: "C++: en uzun kelimenin uzunluğu (temiz kod, bir öneri)"
code: |
  #include <string>
  #include <vector>

  std::size_t longest_word(const std::vector<std::string>& words) {
      std::size_t best = 0;
      for (const std::string& word : words) {
          if (word.size() > best) {
              best = word.size();
          }
      }
      return best;
  }
