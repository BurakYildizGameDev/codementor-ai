[project]
name = "codementor"
# Sürüm tek kaynaktan: src/codementor/__init__.py (Faz D, O18)
dynamic = ["version"]
description = "Kodu düzeltmeyen, denetleyip Sokratik sorular üreten hibrit kod mentorluk motoru"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Burak Yildiz" }]
keywords = [
    "education",
    "code-review",
    "static-analysis",
    "llm",
    "socratic",
    "tree-sitter",
    "unity",
    "unreal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Turkish",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    "jinja2>=3.1",
    "sqlmodel>=0.0.22",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "keyring>=25.7.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-css>=0.25.0",
    "tkinterdnd2>=0.6.3",
    "tomlkit>=0.15.1",
]

[project.urls]
Homepage = "https://github.com/BurakYildizGameDev/codementor-ai"
Repository = "https://github.com/BurakYildizGameDev/codementor-ai"
Issues = "https://github.com/BurakYildizGameDev/codementor-ai/issues"
Changelog = "https://github.com/BurakYildizGameDev/codementor-ai/blob/main/CHANGELOG.md"

[project.scripts]
codementor = "codementor.cli.main:run"

[project.gui-scripts]
codementor-desktop = "codementor.desktop.launch:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "respx>=0.23.1",
    "jsonschema>=4.23",
    "types-jsonschema>=4.26.0.20260518",
    "pyinstaller>=6.22.3",
    "distlib>=0.4.3",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/codementor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codementor"]

# Paket verisi (Faz 23, ADR-0016): `codementor.paths.resource_root()` kurulu wheel'de buraya bakar
[tool.hatch.build.targets.wheel.force-include]
"data" = "codementor/_resources/data"
"prompts" = "codementor/_resources/prompts"
"codementor.toml" = "codementor/_resources/codementor.toml"  # Faz C (O9): kurulu varsayılanlar

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Öğrenci kodu fixture'ları (bilerek hatalı Python dahil) biçimlendirilmez/denetlenmez
# eval/dataset: öğrenci kodu örnekleri (bilerek hatalı/sorunlu; Faz 18)
extend-exclude = ["tests/fixtures", "tests/rules/fixtures", "tests/golden", "eval/dataset"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PT"]
# Türkçe docstring/yorum/mesajlar için
allowed-confusables = ["ı", "×"]  # × : öğrenciye dönük ipucu gerekçelerinde çarpım

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# customtkinter / PyInstaller / tkinterdnd2 tip bilgisi yayımlamıyor (masaüstü, ADR-0013)
module = ["customtkinter.*", "PyInstaller.*", "tkinterdnd2.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not live\""
markers = [
    "live: gerçek sağlayıcı API'sine çıkan testler (ağ gerektirir)",
    "compiler: gerçek derleyici (gcc/clang/dotnet) gerektiren testler; araç yoksa atlanır",
    "slow: yavaş testler",
]
