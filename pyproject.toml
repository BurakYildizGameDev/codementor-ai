[project]
name = "codementor"
version = "0.1.0"
description = "Kodu düzeltmeyen, denetleyip Sokratik sorular üreten hibrit kod mentorluk motoru"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    "jinja2>=3.1",
    "sqlmodel>=0.0.22",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "keyring>=25.7.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-css>=0.25.0",
]

[project.scripts]
codementor = "codementor.cli.main:app"

[project.gui-scripts]
codementor-desktop = "codementor.desktop.launch:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "respx>=0.23.1",
    "jsonschema>=4.23",
    "types-jsonschema>=4.26.0.20260518",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codementor"]

# Paket verisi (Faz 23, ADR-0016): `codementor.paths.resource_root()` kurulu wheel'de buraya bakar
[tool.hatch.build.targets.wheel.force-include]
"data" = "codementor/_resources/data"
"prompts" = "codementor/_resources/prompts"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Öğrenci kodu fixture'ları (bilerek hatalı Python dahil) biçimlendirilmez/denetlenmez
# eval/dataset: öğrenci kodu örnekleri (bilerek hatalı/sorunlu; Faz 18)
extend-exclude = ["tests/fixtures", "tests/rules/fixtures", "tests/golden", "eval/dataset"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PT"]
# Türkçe docstring/yorum/mesajlar için
allowed-confusables = ["ı", "×"]  # × : öğrenciye dönük ipucu gerekçelerinde çarpım

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# customtkinter / PyInstaller tip bilgisi yayımlamıyor (masaüstü istemcisi, ADR-0013)
module = ["customtkinter.*", "PyInstaller.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not live\""
markers = [
    "live: gerçek sağlayıcı API'sine çıkan testler (ağ gerektirir)",
    "compiler: gerçek derleyici (gcc/clang/dotnet) gerektiren testler; araç yoksa atlanır",
    "slow: yavaş testler",
]
