[project]
name = "codementor"
version = "0.1.0"
description = "Kodu düzeltmeyen, denetleyip Sokratik sorular üreten hibrit kod mentorluk motoru"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
]

[project.scripts]
codementor = "codementor.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codementor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PT"]
# Türkçe docstring/yorum/mesajlar için
allowed-confusables = ["ı"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: gerçek sağlayıcı API'sine çıkan testler (ağ gerektirir)",
    "compiler: gerçek derleyici (gcc/clang/dotnet) gerektiren testler; araç yoksa atlanır",
    "slow: yavaş testler",
]
