<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Giriş</title>
</head>
<body>
  <main>
    <h1>Giriş yap</h1>
    <form action="/giris" method="post">
      <label for="kullanici">Kullanıcı adı</label>
      <input id="kullanici" name="kullanici" autocomplete="username">
      <label for="parola">Parola</label>
      <input id="parola" name="parola" type="password" autocomplete="current-password">
      <button type="submit">Giriş</button>
    </form>
  </main>
</body>
</html>
